<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Track Order | LootZone India</title>
  <meta name="description" content="Check real-time order status for your Free Fire and BGMI top-up on LootZone India.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Clean Header -->
  <header class="site-header">
    <div class="mobile-wrap header-inner">
      <a href="/" class="brand">
        <span class="brand-dot"></span>
        LOOTZONE<span>.IN</span>
      </a>

      <div class="header-right">
        <a href="/track" class="track-pill active">
          <span>🔍</span> <span>Track</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Sub Navigation -->
  <div class="nav-tabs-bar">
    <div class="mobile-wrap" style="display: flex; gap: 8px; width: 100%; padding: 0;">
      <a href="/" class="tab-link">Home</a>
      <a href="/freefire" class="tab-link">🔥 Free Fire</a>
      <a href="/bgmi" class="tab-link">🪖 BGMI UC</a>
      <a href="/track" class="tab-link active">🔍 Track</a>
    </div>
  </div>

  <main class="mobile-wrap" style="padding-top: 14px; padding-bottom: 30px; flex: 1;">

    <!-- Search Panel -->
    <div class="panel-card">
      <h2 style="font-family: var(--font-heading); font-size: 1.15rem; font-weight: 800; color: #fff; margin-bottom: 4px;">
        Track Your Top-Up Order
      </h2>
      <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px;">
        Enter your <strong>Player UID</strong> or <strong>Order ID</strong> (e.g. FF-57472).
      </p>

      <form id="track-form" style="display: flex; gap: 8px;">
        <input type="text" id="track-input" class="form-control" placeholder="Enter Order ID or UID..." required style="flex: 1;">
        <button type="submit" class="btn btn-primary" style="padding: 10px 16px; white-space: nowrap;">
          Search
        </button>
      </form>
    </div>

    <!-- Results Container -->
    <div id="results-wrapper">
      <div style="text-align: center; color: var(--text-sub); padding: 24px; font-size: 0.8rem;">
        Enter your Order ID or Player UID above to check delivery status.
      </div>
    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="site-footer">
    <div class="mobile-wrap">
      <div class="footer-inner">
        <div style="font-family: var(--font-heading); font-weight: 800; font-size: 1.05rem; color: #fff;">
          LOOTZONE<span style="color: var(--primary);">.IN</span>
        </div>
        <div class="footer-nav">
          <a href="/">Home</a>
          <a href="/freefire">Free Fire</a>
          <a href="/bgmi">BGMI</a>
          <a href="/track">Track</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const form = document.getElementById('track-form');
    const input = document.getElementById('track-input');
    const resultsWrapper = document.getElementById('results-wrapper');

    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('query');
    if (initialQuery) {
      input.value = initialQuery;
      doSearch(initialQuery);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (q) doSearch(q);
    });

    async function doSearch(query) {
      resultsWrapper.innerHTML = `
        <div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 0.82rem;">
          Searching records...
        </div>
      `;

      try {
        const res = await fetch(`/api/orders/track?query=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data.orders && data.orders.length > 0) {
          renderOrders(data.orders);
        } else {
          resultsWrapper.innerHTML = `
            <div class="panel-card" style="text-align: center; padding: 24px;">
              <h3 style="font-size: 1rem; color: #fff; margin-bottom: 4px;">No Order Found</h3>
              <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px;">
                No orders matching "${query}". Please check your UID or Order ID.
              </p>
              <a href="https://wa.me/919876543210" target="_blank" class="btn btn-secondary btn-sm">
                💬 Ask on WhatsApp
              </a>
            </div>
          `;
        }
      } catch (err) {
        resultsWrapper.innerHTML = `
          <div style="text-align: center; color: var(--accent-red); padding: 20px;">
            Error searching order.
          </div>
        `;
      }
    }

    function renderOrders(orders) {
      resultsWrapper.innerHTML = orders.map(order => {
        const isCompleted = order.status === 'completed';
        const isRejected = order.status === 'rejected';
        const isPending = order.status === 'pending';

        const statusColor = isCompleted ? 'var(--accent-green)' : (isRejected ? 'var(--accent-red)' : 'var(--accent-amber)');
        const statusLabel = isCompleted ? 'Completed & Delivered ✓' : (isRejected ? 'Rejected ✕' : 'Processing Top-Up ⏳');

        return `
          <div class="panel-card" style="border-left: 4px solid ${statusColor};">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <span style="font-family: var(--font-mono); font-weight: 700; color: #fff; font-size: 0.9rem;">#${order.id}</span>
              <span style="color: ${statusColor}; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;">
                ${statusLabel}
              </span>
            </div>

            <div class="summary-container" style="margin-bottom: 12px; padding: 10px;">
              <div class="summary-line">
                <span>Game</span>
                <span style="color: #fff; font-weight: 600;">${order.gameName}</span>
              </div>
              <div class="summary-line">
                <span>Player UID</span>
                <span style="color: var(--primary); font-family: var(--font-mono); font-weight: 700;">${order.uid}</span>
              </div>
              <div class="summary-line">
                <span>Package</span>
                <span style="color: var(--accent-green); font-weight: 700;">${order.totalItems} ${order.itemType}</span>
              </div>
              <div class="summary-line">
                <span>Price</span>
                <span style="color: #fff; font-weight: 700;">₹${order.price}</span>
              </div>
            </div>

            <!-- Stepper -->
            <div class="stepper-clean">
              <div class="step-item done">
                <div class="step-circle">✓</div>
                <div class="step-desc">
                  <h4>Order Placed</h4>
                  <p>Order registered in system</p>
                </div>
              </div>

              <div class="step-item ${isCompleted || isPending ? 'done' : ''}">
                <div class="step-circle">${isCompleted || isPending ? '✓' : '2'}</div>
                <div class="step-desc">
                  <h4>Payment Confirmed</h4>
                  <p>UPI UTR reference verified</p>
                </div>
              </div>

              <div class="step-item ${isCompleted ? 'done' : (isPending ? 'active' : '')}">
                <div class="step-circle">${isCompleted ? '✓' : (isPending ? '⏳' : '3')}</div>
                <div class="step-desc">
                  <h4>Top-Up Delivery</h4>
                  <p>${isCompleted ? 'Diamonds/UC credited directly to your UID!' : 'Delivery in progress via UID partner'}</p>
                </div>
              </div>
            </div>

            <div style="margin-top: 10px;">
              <a href="https://wa.me/919876543210?text=${encodeURIComponent(`Hello! Order status inquiry for #${order.id} (UID: ${order.uid})`)}" target="_blank" class="btn btn-secondary btn-full btn-sm">
                💬 WhatsApp Support for this Order
              </a>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>

</body>
</html>
